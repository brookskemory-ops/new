name: Desktop build

# Windows binaries are built on a Windows runner because cross-compiling them
# elsewhere cannot be tested. Push a v* tag to publish a release; run the
# workflow by hand to get an installer you can download without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The calculation engine is platform independent, so a failure here means
      # the build is broken regardless of target.
      - run: npm run test

      - run: npm run tauri:build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          ls -lh artifacts
          # An empty artifacts folder means the bundler silently produced nothing.
          if [ -z "$(ls -A artifacts)" ]; then
            echo "No installer was produced" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: satisfactory-companion-windows
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Download the `.exe` installer below and run it.

            Windows will show a SmartScreen warning the first time, because the
            installer is not code signed — signing needs a paid certificate.
            Choose **More info** then **Run anyway** to continue.
